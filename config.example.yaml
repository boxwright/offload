# Offload settings. Every key is optional; these are the defaults.
# Put your own values in ~/.config/offload/config.yaml (or point OFFLOAD_CONFIG at a file).

# jobs_root: ~/.local/share/offload/jobs
# budget_file: ~/.config/offload/budget.yaml
# repositories intake may choose from
# repos_file: ~/.config/offload/repos.yaml
# from `claude setup-token`; chmod 600
# How the paid worker signs in. subscription: the token from `claude setup-token` in token_file, drawn from your
# Pro or Max plan. api_key: the key in api_key_file, billed per call at API prices.
# claude_auth: subscription
# token_file: ~/.config/offload/claude-token
# api_key_file: ~/.config/offload/anthropic-api-key
# optional; chmod 600
# webhook_file: ~/.config/offload/discord-webhook
# Where messages go. discord needs webhook_file; ntfy needs ntfy_url and, for a protected topic, ntfy_token_file.
# notifier: discord
# ntfy_url: ""
# ntfy_token_file: ~/.config/offload/ntfy-token
# ledger: ~/.local/state/offload/ledger.jsonl
# pause_file: ~/.local/state/offload/PAUSE
# sandbox_image: offload-sandbox:latest
# the network the proxy is on
# docker_network: offload_net
# the proxy, as seen from that network
# proxy_url: http://offload-proxy:4000
# the model name the proxy exposes
# local_model_name: local-model
# local_max_turns: 40

# Every worker container gets these hard limits. Memory has no swap behind it.
# sandbox_memory: "4g"
# sandbox_cpus: 2.0
# sandbox_pids: 512

# Every worker container gets these hard limits. Memory has no swap behind it.
# sandbox_memory: "4g"
# sandbox_cpus: 2.0
# sandbox_pids: 512
# claude_tools: "Read,Glob,Grep,Edit,Write,Bash(python3 *),Bash(python *),Bash(pytest *),Bash(git diff *),Bash(git status *),Bash(git log *),Bash(ls *),Bash(cat *)"
# local_tools: "Read,Glob,Grep,Edit,Write,Bash(python3 *),Bash(python *),Bash(pytest *),Bash(git diff *),Bash(git status *),Bash(git log *),Bash(ls *),Bash(cat *),Bash(head *),Bash(tail *),Bash(wc *),Bash(grep *),Bash(find *),Bash(mkdir *),Bash(sed *),Bash(diff *)"
# the author of the one commit per job
# git_user_name: offload
# git_user_email: offload@localhost
# True runs the test command outside the sandbox
# run_tests_on_host: false
# prepended to PATH when run_tests_on_host is true
# host_test_path: ""
# step_timeout: 1200
# max_test_fails: 3
# gate_wait_s: 86400

# Finished jobs older than this many days lose work/, claude-home/ and scratch/. Reports and events stay. 0 = off.
# keep_days: 14
