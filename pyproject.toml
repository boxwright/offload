[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "boxwright-offload"
version = "0.1.0"
description = "Offload: make your Claude subscription last longer by doing the typing on a local model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Boxwright" }]
dependencies = ["pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
offload = "offload.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/offload/prompts.py" = ["E501"]   # prompts are prose sent to a model; wrapping them changes the text
